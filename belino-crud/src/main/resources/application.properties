spring.application.name=belino-crud

# Create dbCRUD1 in MySQL first, or set DB_URL to an existing database.
# Keep the unauthenticated API restricted to this machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbCRUD1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
server.port=8080
server.address=127.0.0.1
server.error.include-stacktrace=never
server.error.include-message=always